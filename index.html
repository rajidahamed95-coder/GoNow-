<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="GoNow! compares every ride app in one honest, all-in price. Estimates only — you book in the provider's app.">
  <title>GoNow! — every ride app, one honest price</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GoNow!">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="var(--accent)"/><path d="M8.5 7.5l5 4.5-5 4.5" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-name">GoNow!</span></div>
      <div class="market-pill" id="marketPill" aria-label="Market"></div>
    </header>

    <main class="stage">
      <section id="home" class="view is-active" aria-label="Where to"></section>
      <section id="results" class="view" aria-label="Compare prices"></section>
    </main>
  </div>

  <div id="picker" class="picker" aria-hidden="true" role="dialog" aria-label="Search places"></div>
  <div id="handoff" class="sheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="handoffTitle"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
